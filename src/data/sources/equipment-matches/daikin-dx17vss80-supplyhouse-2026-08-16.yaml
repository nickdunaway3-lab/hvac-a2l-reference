# transcribed verbatim from the same distributor-hosted quick-reference PDF
# as the Goodman GSXN4 batch (page 3 of the source document). Same caveats
# apply: distributor-compiled, not primary, everything needs_review.
#
# Two rows below are flagged, not silently corrected, per the site's rule
# against ever inferring/guessing a spec value:
#
#   1. DX17VSS301's horizontal-coil (CHPE3636B4) variant has NO second AHRI
#      reference number in the source at all — only one AHRI number is given
#      for two listed coil options. We only record the variant we have a real
#      number for (the upflow one) and skip the other rather than guess it.
#   2. DX17VSS361's upflow-coil row lists AHRI reference number 202334814 —
#      identical to the number three rows up for DX17VSS301. AHRI reference
#      numbers are 1:1 with a specific matched combination, so a repeat
#      across two different outdoor models is almost certainly a
#      transcription error in the source PDF, not a real shared certificate.
#      Recorded as-is, flagged needs_review with a note, not corrected.
